<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityGO - High-Tech Real World Global Shop Explorer</title>
  
  <!-- Leaflet CSS for Real World Interactive Mapping -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Google Fonts for Cyberpunk / Modern Tech Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. GLOBAL BASE STYLES & CYBERPUNK THEME
       ========================================================================== */
    :root {
      --bg-dark: #080a0f;
      --bg-card: #121620;
      --bg-card-hover: #1a202c;
      --panel-bg: rgba(18, 22, 32, 0.95);
      --border-color: #232a3b;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-pink: #ff0844;
      --accent-purple: #9b51e0;
      --accent-green: #00ff87;
      --accent-yellow: #ffb199;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-code: 'Roboto Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
    }

    /* Scrollbar Customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-cyan);
    }

    /* ==========================================================================
       2. LAYOUT STRUCTURE
       ========================================================================== */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Sidebar Navigation & Directory */
    #sidebar {
      width: 420px;
      min-width: 420px;
      height: 100vh;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.7);
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(8, 10, 15, 0.8);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-weight: 900;
      color: var(--bg-dark);
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .logo-text {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--text-main), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    #search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    #search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Category Filter Tags */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      background: rgba(18, 22, 32, 0.5);
    }

    .filter-tag {
      padding: 6px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-tag.active, .filter-tag:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Shop List Directory */
    .shop-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: flex-col;
      gap: 16px;
    }

    .shop-card {
      display: flex;
      gap: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      position: relative;
      overflow: hidden;
    }

    .shop-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-cyan);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .shop-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-3px);
      border-color: rgba(0, 242, 254, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .shop-card:hover::before {
      opacity: 1;
    }

    .shop-card-thumb {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .shop-card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .shop-card-info h3 {
      font-family: var(--font-title);
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .shop-card-info .category {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .shop-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .rating-badge {
      background: rgba(255, 177, 153, 0.15);
      color: var(--accent-yellow);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;

      .map-popup h3 {
        color: var(--accent-cyan);
        font-family: var(--font-title);
        margin-bottom: 4px;
      }
    }

    /* Main Map Workspace */
    #map-container {
      flex: 1;
      height: 100vh;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
    }

    /* Detail Side-Panel */
    #detail-panel {
      position: absolute;
      right: 24px;
      top: 24px;
      width: 440px;
      max-height: calc(100vh - 48px);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      overflow-y: auto;
      z-index: 1001;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    #detail-panel.hidden {
      transform: translateX(500px);
      opacity: 0;
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: var(--accent-pink);
      color: #fff;
      border-color: var(--accent-pink);
    }

    /* Detail Content Elements */
    .detail-header-img {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .detail-title {
      font-family: var(--font-title);
      font-size: 1.5rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .detail-sub {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: var(--bg-dark);
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      font-family: var(--font-title);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
      transform: translateY(-2px);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .gallery-grid img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
      border-color: var(--accent-cyan);
    }

    /* ==========================================================================
       3. HIGH-TECH NEON LEAFLET MAP STYLES
       ========================================================================== */
    .custom-map-pin {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-cyan), 0 0 24px var(--accent-cyan);
    }

    .pin-pulse {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      animation: neon-pulse 2s infinite ease-out;
    }

    @keyframes neon-pulse {
      0% {
        transform: scale(0.4);
        opacity: 1;
      }
      100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }

    .leaflet-popup-content-wrapper {
      background: var(--bg-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--accent-cyan);
      border-radius: 12px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8) !important;
    }

    .leaflet-popup-tip {
      background: var(--bg-card) !important;
    }

    .map-popup h3 {
      font-family: var(--font-title);
      color: var(--accent-cyan);
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .map-popup p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .map-popup button {
      width: 100%;
      padding: 8px;
      background: var(--accent-cyan);
      border: none;
      color: var(--bg-dark);
      font-family: var(--font-title);
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Sidebar Directory -->
    <aside id="sidebar">
      <header class="sidebar-header">
        <div class="logo-container">
          <div class="logo-icon">GO</div>
          <div class="logo-text">CityGO</div>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search shops, categories, cities...">
        </div>
      </header>

      <!-- Category Filter Tags -->
      <div class="filter-bar" id="category-filters">
        <div class="filter-tag active" data-category="ALL">All Places</div>
        <div class="filter-tag" data-category="Tech & Electronics">Tech & Electronics</div>
        <div class="filter-tag" data-category="Café & Workstation">Cafés</div>
        <div class="filter-tag" data-category="Fashion & Apparel">Fashion</div>
        <div class="filter-tag" data-category="Dining & Gastronomy">Dining</div>
        <div class="filter-tag" data-category="Art & Cyber Hub">Art & Culture</div>
      </div>

      <!-- Shop Listings Container -->
      <div id="shop-list" class="shop-list-container">
        <!-- Rendered dynamically by UI controller -->
      </div>
    </aside>

    <!-- Main Leaflet Map Viewport -->
    <main id="map-container">
      <div id="map"></div>
    </main>

    <!-- Shop Details Floating Panel -->
    <section id="detail-panel" class="hidden">
      <button id="close-panel" class="close-btn">&times;</button>
      <div id="detail-content">
        <!-- Rendered dynamically on selection -->
      </div>
    </section>
  </div>

  <!-- Leaflet JS Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Integrated Application Modules -->
  <script>
    /* ==========================================================================
       4. SHOPS ENGINE DATABASE (Expanded Worldwide Real-World Data)
       ========================================================================== */
    const ShopsEngine = {
      shops: [
        {
          id: "shop-nyc-tech",
          name: "CyberTech Hub NYC",
          category: "Tech & Electronics",
          rating: 4.9,
          reviewsCount: 1240,
          lat: 40.7128,
          lng: -74.0060, // New York City
          city: "New York, USA",
          address: "100 Broadway, New York, NY 10005",
          phone: "+1 212-555-0192",
          openingHours: "09:00 AM - 10:00 PM",
          description: "Premier flagship destination for custom water-cooled rigs, VR gaming gear, neural interface accessories, and modular electronics.",
          mainImage: "https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=600",
          photos: [
            "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400",
            "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400",
            "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400",
            "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400"
          ]
        },
        {
          id: "shop-nyc-coffee",
          name: "Neon Roast Lab",
          category: "Café & Workstation",
          rating: 4.8,
          reviewsCount: 890,
          lat: 40.7200,
          lng: -74.0100, // Soho, NYC
          city: "New York, USA",
          address: "45 Mercer St, Soho, New York, NY 10013",
          phone: "+1 212-555-0144",
          openingHours: "07:00 AM - 11:00 PM",
          description: "High-octane artisanal cold brews, nitrogen coffee taps, and ultra-fast 10Gbps fiber Wi-Fi workstations.",
          mainImage: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600",
          photos: [
            "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400",
            "https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=400",
            "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400",
            "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400"
          ]
        },
        {
          id: "shop-tokyo-fashion",
          name: "Akihabara Matrix Wear",
          category: "Fashion & Apparel",
          rating: 4.95,
          reviewsCount: 2150,
          lat: 35.6997,
          lng: 139.7714, // Akihabara, Tokyo
          city: "Tokyo, Japan",
          address: "4-1-1 Sotokanda, Chiyoda City, Tokyo 101-0021",
          phone: "+81 3-5555-0123",
          openingHours: "10:00 AM - 09:00 PM",
          description: "Futuristic streetwear, LED-integrated jackets, hydrophobic techwear, and high-tech anime apparel.",
          mainImage: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600",
          photos: [
            "https://images.unsplash.com/photo-1445205170230-053b83016050?w=400",
            "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=400",
            "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?w=400",
            "https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=400"
          ]
        },
        {
          id: "shop-london-dining",
          name: "The Cybernetics Bistro",
          category: "Dining & Gastronomy",
          rating: 4.7,
          reviewsCount: 650,
          lat: 51.5074,
          lng: -0.1278, // Central London
          city: "London, UK",
          address: "22 Baker Street, London NW1 6XE",
          phone: "+44 20 7946 0912",
          openingHours: "12:00 PM - 12:00 AM",
          description: "Molecular gastronomy meets immersive holographic projection dining experiences in the heart of London.",
          mainImage: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600",
          photos: [
            "https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?w=400",
            "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=400",
            "https://images.unsplash.com/photo-1559339352-11d035aa65de?w=400",
            "https://images.unsplash.com/photo-1544025162-d76694265947?w=400"
          ]
        },
        {
          id: "shop-paris-art",
          name: "Galerie Digital Neo",
          category: "Art & Cyber Hub",
          rating: 4.88,
          reviewsCount: 510,
          lat: 48.8566,
          lng: 2.3522, // Paris
          city: "Paris, France",
          address: "14 Rue de Rivoli, 75004 Paris",
          phone: "+33 1 42 68 55 00",
          openingHours: "11:00 AM - 08:00 PM",
          description: "Contemporary digital art gallery specializing in 3D installations, interactive light sculptures, and NFT showcases.",
          mainImage: "https://images.unsplash.com/photo-1561214115-f2f134cc4912?w=600",
          photos: [
            "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=400",
            "https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?w=400",
            "https://images.unsplash.com/photo-1547826039-bfc35e0f1ea8?w=400",
            "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=400"
          ]
        }
      ],

      getAll() {
        return this.shops;
      },

      getById(id) {
        return this.shops.find(s => s.id === id);
      },

      filterByCategory(cat) {
        if (cat === "ALL") return this.shops;
        return this.shops.filter(s => s.category === cat);
      },

      search(query) {
        const q = query.toLowerCase();
        return this.shops.filter(s => 
          s.name.toLowerCase().includes(q) ||
          s.category.toLowerCase().includes(q) ||
          s.city.toLowerCase().includes(q) ||
          s.description.toLowerCase().includes(q)
        );
      }
    };

    /* ==========================================================================
       5. MAP ENGINE (Leaflet.js Controller)
       ========================================================================== */
    const MapEngine = {
      map: null,
      markers: {},

      init() {
        // Initialize map on NYC center
        this.map = L.map('map', {
          zoomControl: false
        }).setView([40.7128, -74.0060], 3);

        // Add Zoom Control to Top Right
        L.control.zoom({ position: 'topright' }).addTo(this.map);

        // Add CartoDB Dark Matter High-Tech Vector Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          subdomains: 'abcd',
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(this.map);

        // Render Initial Map Pins
        this.renderPins(ShopsEngine.getAll());
      },

      renderPins(shops) {
        // Clear Existing Markers
        Object.values(this.markers).forEach(m => this.map.removeLayer(m));
        this.markers = {};

        shops.forEach(shop => {
          const icon = L.divIcon({
            className: 'custom-map-pin',
            html: `<div class="pin-pulse"></div><div class="pin-dot"></div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });

          const marker = L.marker([shop.lat, shop.lng], { icon: icon }).addTo(this.map);

          marker.bindPopup(`
            <div class="map-popup">
              <h3>${shop.name}</h3>
              <p>${shop.category} • ${shop.city}</p>
              <button onclick="UI.selectShop('${shop.id}')">INSPECT LOCATION</button>
            </div>
          `);

          this.markers[shop.id] = marker;
        });
      },

      focusShop(shop) {
        if (!shop) return;
        this.map.flyTo([shop.lat, shop.lng], 15, {
          animate: true,
          duration: 1.8
        });

        if (this.markers[shop.id]) {
          this.markers[shop.id].openPopup();
        }
      }
    };

    /* ==========================================================================
       6. UI CONTROLLER MODULE
       ========================================================================== */
    const UI = {
      activeCategory: "ALL",

      init() {
        this.renderList(ShopsEngine.getAll());
        this.bindEvents();
      },

      bindEvents() {
        // Search Input Event
        document.getElementById('search-input').addEventListener('input', (e) => {
          const filtered = ShopsEngine.search(e.target.value);
          this.renderList(filtered);
          MapEngine.renderPins(filtered);
        });

        // Category Filter Buttons
        document.querySelectorAll('.filter-tag').forEach(tag => {
          tag.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            
            const category = e.target.getAttribute('data-category');
            this.activeCategory = category;
            
            const filtered = ShopsEngine.filterByCategory(category);
            this.renderList(filtered);
            MapEngine.renderPins(filtered);
          });
        });

        // Close Detail Panel Button
        document.getElementById('close-panel').addEventListener('click', () => {
          document.getElementById('detail-panel').classList.add('hidden');
        });
      },

      renderList(shops) {
        const container = document.getElementById('shop-list');
        container.innerHTML = '';

        if (shops.length === 0) {
          container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 40px;">No places found.</div>`;
          return;
        }

        shops.forEach(shop => {
          const card = document.createElement('div');
          card.className = 'shop-card';
          card.innerHTML = `
            <img src="${shop.mainImage}" alt="${shop.name}" class="shop-card-thumb">
            <div class="shop-card-info">
              <h3>${shop.name}</h3>
              <div class="category">${shop.category}</div>
              <div class="shop-card-meta">
                <span class="rating-badge">⭐ ${shop.rating}</span>
                <span style="color: var(--text-muted);">${shop.city}</span>
              </div>
            </div>
          `;

          card.addEventListener('click', () => this.selectShop(shop.id));
          container.appendChild(card);
        });
      },

      selectShop(id) {
        const shop = ShopsEngine.getById(id);
        if (!shop) return;

        MapEngine.focusShop(shop);

        const panel = document.getElementById('detail-panel');
        const content = document.getElementById('detail-content');

        content.innerHTML = `
          <img src="${shop.mainImage}" alt="${shop.name}" class="detail-header-img">
          <h2 class="detail-title">${shop.name}</h2>
          <div class="detail-sub">
            <span class="rating-badge">⭐ ${shop.rating} (${shop.reviewsCount} reviews)</span>
            <span>📍 ${shop.city}</span>
          </div>
          <p style="color: var(--text-muted); margin-bottom: 12px; font-size: 0.95rem;">
            <strong>Address:</strong> ${shop.address}<br>
            <strong>Hours:</strong> ${shop.openingHours}
          </p>
          <p style="line-height: 1.6; margin-bottom: 20px;">${shop.description}</p>

          <div class="action-buttons">
            <a href="tel:${shop.phone}" class="btn-action">📞 Call Hub</a>
            <a href="sms:${shop.phone}" class="btn-action">💬 Send Message</a>
          </div>

          <h3 style="font-family: var(--font-title); font-size: 1.1rem; color: var(--accent-cyan); margin-bottom: 10px;">HQ GALLERY</h3>
          <div class="gallery-grid">
            ${shop.photos.map(p => `<img src="${p}" alt="Gallery photo">`).join('')}
          </div>
        `;

        panel.classList.remove('hidden');
      }
    };

    /* ==========================================================================
       7. MASTER BOOTSTRAP INITIALIZATION
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      MapEngine.init();
      UI.init();
      console.log("CityGO High-Tech Global Explorer Active!");
    });
  </script>
</body>
</html>
