<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityGO — Live Urban Explorer</title>

  <!-- Google Fonts System -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet GIS Mapping Framework Core Stylesheet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & DESIGN SYSTEM
       ========================================================================== */
    :root {
      --color-bg-main: #f8fafc;
      --color-bg-surface: #ffffff;
      --color-bg-subtle: #f1f5f9;
      --color-bg-topbar: #e2e8f0;
      
      --color-accent-purple: #7c3aed;
      --color-accent-purple-soft: #f3e8ff;
      --color-accent-pink: #ec4899;
      --color-accent-gold: #f59e0b;

      --color-text-primary: #0f172a;
      --color-text-secondary: #475569;
      --color-text-muted: #94a3b8;

      --border-light: 1px solid #e2e8f0;
      --border-bubbly: 1.5px solid #cbd5e1;

      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;

      --radius-xs: 6px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-pill: 9999px;

      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(124, 58, 237, 0.12);

      --sidebar-width: 320px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      background-color: var(--color-bg-main);
      color: var(--color-text-primary);
      font-size: 13px;
    }

    .app-viewport-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ==========================================================================
       2. DULL WHITE & PURE BLACK TOP NAVIGATION BAR
       ========================================================================== */
    .app-topbar {
      height: 48px;
      background-color: var(--color-bg-topbar);
      border-bottom: var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      flex-shrink: 0;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 15px;
      color: #000000;
      letter-spacing: -0.3px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background-color: #f8fafc; /* Dull white */
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #000000; /* Pure black symbol */
    }

    .topbar-btn:hover {
      background-color: #ffffff;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .topbar-btn svg {
      width: 16px;
      height: 16px;
      stroke: #000000;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       3. MAIN CONTENT CONTAINER
       ========================================================================== */
    .app-main-layout {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Compact Sidebar (320px) */
    .compact-sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background: var(--color-bg-surface);
      border-right: var(--border-light);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 16px 10px 16px;
      border-bottom: var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 800;
      color: var(--color-text-primary);
      letter-spacing: -0.3px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 34px;
      background-color: var(--color-bg-subtle);
      border: var(--border-bubbly);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      outline: none;
    }

    .search-input:focus {
      background-color: #ffffff;
      border-color: var(--color-accent-purple);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 12px;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .filter-chips-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: var(--border-light);
      background-color: var(--color-bg-surface);
    }

    .filter-chips-row::-webkit-scrollbar { display: none; }

    .chip-btn {
      flex: 0 0 auto;
      padding: 5px 12px;
      background-color: var(--color-bg-subtle);
      border: var(--border-light);
      border-radius: var(--radius-pill);
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      background: var(--color-accent-purple);
      color: #ffffff;
      border-color: transparent;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: var(--color-bg-main);
      border-bottom: var(--border-light);
      font-size: 11px;
      color: var(--color-text-muted);
    }

    .shop-cards-list {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .compact-card {
      background: var(--color-bg-surface);
      border: var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .compact-card:hover {
      border-color: var(--color-accent-purple);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .card-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--color-accent-purple-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .card-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .card-category-tag {
      font-size: 9px;
      font-weight: 800;
      color: var(--color-accent-purple);
      text-transform: uppercase;
    }

    .card-title-text {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle-text {
      font-size: 11px;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================================
       4. MAP VIEWPORT & MARKERS
       ========================================================================== */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map-viewport {
      width: 100%;
      height: 100%;
    }

    .map-status-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: var(--border-light);
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      color: var(--color-accent-purple);
      box-shadow: var(--shadow-md);
      z-index: 500;
      display: none;
    }

    .bubbly-map-marker-wrap { background: transparent; border: none; }
    .bubbly-map-marker {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--color-accent-purple);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
      display: flex; justify-content: flex-end;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-panel {
      width: 100%; max-width: 400px; height: 100%;
      background: #ffffff;
      padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="app-viewport-wrapper">
    
    <!-- Dull White & Pure Black Top Navigation Bar -->
    <header class="app-topbar">
      <div class="topbar-brand">
        <span>📍</span> CityGO Live
      </div>

      <div class="topbar-actions">
        <!-- CHAT -->
        <button class="topbar-btn" title="Chat">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <!-- USER ACCOUNT -->
        <button class="topbar-btn" title="User Account">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <!-- CALL -->
        <button class="topbar-btn" title="Call">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <!-- i (INFO) -->
        <button class="topbar-btn" title="Info">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </button>
        <!-- ? (HELP) -->
        <button class="topbar-btn" title="Help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <!-- CAB -->
        <button class="topbar-btn" title="Cab">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="7" rx="2"/><path d="M5 11l2-5h10l2 5"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        </button>
        <!-- AEROPLANE -->
        <button class="topbar-btn" title="Aeroplane">
          <svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.8-.2-1.6.1-2.1.7l-.6.6 5.3 3.8-3.2 3.2-2.1-.7c-.4-.1-.9 0-1.2.3l-.4.4 2.8 2.8 2.8 2.8.4-.4c.3-.3.4-.8.3-1.2l-.7-2.1 3.2-3.2 3.8 5.3.6-.6c.6-.5.9-1.3.7-2.1z"/></svg>
        </button>
        <!-- TRAIN -->
        <button class="topbar-btn" title="Train">
          <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="M8 19l-3 3"/><path d="M16 19l3 3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Layout Content -->
    <div class="app-main-layout">
      
      <!-- Compact Sidebar -->
      <aside class="compact-sidebar">
        <header class="sidebar-header">
          <h1 class="sidebar-title">Explore Venues</h1>
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search live places..." />
          </div>
        </header>

        <nav class="filter-chips-row" id="filter-chips">
          <button class="chip-btn active" data-category="ALL">All</button>
          <button class="chip-btn" data-category="CAFE">☕ Cafes</button>
          <button class="chip-btn" data-category="DINING">🍜 Dining</button>
          <button class="chip-btn" data-category="SHOPPING">🛍️ Shopping</button>
          <button class="chip-btn" data-category="CULTURE">🎨 Culture</button>
        </nav>

        <div class="stats-bar">
          <span><strong id="venue-count">0</strong> verified spots found</span>
        </div>

        <div class="shop-cards-list" id="shop-cards-list">
          <!-- Dynamically populated -->
        </div>
      </aside>

      <!-- Map Viewport -->
      <main class="map-container">
        <div id="map-status" class="map-status-pill">⚡ Updating live places...</div>
        <div id="map-viewport"></div>
      </main>

    </div>
  </div>

  <!-- Detail Modal Panel -->
  <div class="modal-overlay" id="venue-modal">
    <div class="modal-panel">
      <button id="modal-close" style="align-self: flex-end; background:none; border:none; font-size:18px; cursor:pointer;">✕</button>
      <div id="modal-icon" style="font-size:48px;">📍</div>
      <h2 id="modal-title" class="sidebar-title">Venue Title</h2>
      <p id="modal-category" style="color:var(--color-accent-purple); font-weight:700; text-transform:uppercase; font-size:11px;"></p>
      <p id="modal-address" style="color:var(--color-text-secondary); font-size:12px;">Address</p>
    </div>
  </div>

  <!-- Leaflet GIS Script -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    let LIVE_VENUES = [];

    // Clean English Text Filter Helper
    function cleanToEnglishText(str, fallback) {
      if (!str) return fallback;
      // Remove non-ASCII characters if dominant, fallback to clean translation tags
      const asciiOnly = str.replace(/[^\x00-\x7F]/g, "").trim();
      return asciiOnly.length > 2 ? asciiOnly : fallback;
    }

    function resolveCategory(tags) {
      if (tags.amenity === 'cafe' || tags.cuisine === 'coffee_shop') return { cat: 'CAFE', emoji: '☕', nameFallback: 'Local Cafe' };
      if (tags.amenity === 'restaurant' || tags.amenity === 'fast_food') return { cat: 'DINING', emoji: '🍜', nameFallback: 'Local Restaurant' };
      if (tags.shop) return { cat: 'SHOPPING', emoji: '🛍️', nameFallback: 'Boutique Shop' };
      if (tags.tourism || tags.amenity === 'museum' || tags.amenity === 'arts_centre') return { cat: 'CULTURE', emoji: '🎨', nameFallback: 'Cultural Spot' };
      return { cat: 'BUSINESS', emoji: '🏬', nameFallback: 'Commercial Venue' };
    }

    // Map Engine
    class MapEngine {
      constructor(containerId, onSelect, onBoundsChange) {
        this.map = L.map(containerId, { zoomControl: false }).setView([35.6762, 139.6503], 15);
        this.markers = new Map();
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap'
        }).addTo(this.map);

        let debounce = null;
        this.map.on('moveend', () => {
          clearTimeout(debounce);
          debounce = setTimeout(() => onBoundsChange(this.map.getBounds()), 400);
        });

        setTimeout(() => {
          this.map.invalidateSize();
          onBoundsChange(this.map.getBounds());
        }, 300);
      }

      render(venues, onSelect) {
        this.markers.forEach(m => this.map.removeLayer(m));
        this.markers.clear();

        venues.forEach(venue => {
          const icon = L.divIcon({
            className: 'bubbly-map-marker-wrap',
            html: `<div class="bubbly-map-marker">${venue.emoji}</div>`,
            iconSize: [36, 36], iconAnchor: [18, 18]
          });

          const marker = L.marker([venue.lat, venue.lng], { icon }).addTo(this.map);
          marker.on('click', () => onSelect(venue.id));
          this.markers.set(venue.id, marker);
        });
      }

      flyTo(venue) {
        this.map.flyTo([venue.lat, venue.lng], 16);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      let currentCategory = 'ALL';
      let searchQuery = '';
      const statusPill = document.getElementById('map-status');

      const mapEngine = new MapEngine('map-viewport', selectVenue, fetchLivePlaces);

      async function fetchLivePlaces(bounds) {
        if (mapEngine.map.getZoom() < 13) {
          document.getElementById('venue-count').textContent = "0 (Zoom in closer)";
          return;
        }

        statusPill.style.display = 'block';
        const s = bounds.getSouth(), w = bounds.getWest(), n = bounds.getNorth(), e = bounds.getEast();

        // High-speed Overpass query fetching live spots while strictly ignoring residential apartments
        const query = `[out:json][timeout:10];(node["amenity"](${s},${w},${n},${e});node["shop"](${s},${w},${n},${e});node["tourism"](${s},${w},${n},${e}););out center 40;`;

        try {
          const res = await fetch('https://overpass-api.de/api/interpreter', {
            method: 'POST', body: 'data=' + encodeURIComponent(query)
          });
          const data = await res.json();

          LIVE_VENUES = data.elements
            .filter(el => {
              const t = el.tags || {};
              const isApartment = t.building === 'apartments' || t.building === 'residential' || t.residential;
              return !isApartment;
            })
            .map(el => {
              const t = el.tags || {};
              const { cat, emoji, nameFallback } = resolveCategory(t);
              
              // Ensure English Title
              const rawName = t['name:en'] || t.name || nameFallback;
              const englishName = cleanToEnglishText(rawName, nameFallback);

              return {
                id: `osm-${el.id}`,
                name: englishName,
                category: cat,
                emoji: emoji,
                address: t['addr:street'] ? cleanToEnglishText(`${t['addr:housenumber'] || ''} ${t['addr:street']}`, 'Main Street') : 'Local District',
                lat: el.lat,
                lng: el.lon
              };
            });

          renderUI();
        } catch (err) {
          console.error("Live fetch error:", err);
        } finally {
          statusPill.style.display = 'none';
        }
      }

      function renderUI() {
        const filtered = LIVE_VENUES.filter(v => {
          const catMatch = currentCategory === 'ALL' || v.category === currentCategory;
          const searchMatch = v.name.toLowerCase().includes(searchQuery.toLowerCase());
          return catMatch && searchMatch;
        });

        document.getElementById('venue-count').textContent = filtered.length;
        const container = document.getElementById('shop-cards-list');
        container.innerHTML = '';

        filtered.forEach(venue => {
          const card = document.createElement('div');
          card.className = 'compact-card';
          card.innerHTML = `
            <div class="card-icon-box">${venue.emoji}</div>
            <div class="card-details">
              <span class="card-category-tag">${venue.category}</span>
              <div class="card-title-text">${venue.name}</div>
              <div class="card-subtitle-text">📍 ${venue.address}</div>
            </div>
          `;
          card.addEventListener('click', () => {
            selectVenue(venue.id);
            mapEngine.flyTo(venue);
          });
          container.appendChild(card);
        });

        mapEngine.render(filtered, selectVenue);
      }

      function selectVenue(id) {
        const v = LIVE_VENUES.find(item => item.id === id);
        if (!v) return;
        document.getElementById('modal-icon').textContent = v.emoji;
        document.getElementById('modal-title').textContent = v.name;
        document.getElementById('modal-category').textContent = v.category;
        document.getElementById('modal-address').textContent = `📍 ${v.address}`;
        document.getElementById('venue-modal').classList.add('active');
      }

      document.getElementById('filter-chips').addEventListener('click', (e) => {
        if (!e.target.classList.contains('chip-btn')) return;
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        renderUI();
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderUI();
      });

      document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('venue-modal').classList.remove('active');
      });
    });
  </script>
</body>
</html>
