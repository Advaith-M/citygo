<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CityGO — High-Tech Global Shop Explorer & Bubbly Directory</title>
  <meta name="description" content="Discover ultra-luxurious, aesthetic, and bubbly venues across global cities with CityGO interactive map navigation.">
  <meta name="theme-color" content="#ffffff">

  <!-- Favicon Preloads -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">

  <!-- Google Fonts Preconnect & Styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Leaflet GIS Map Engine Core Stylesheet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- CityGO Modular CSS Architecture (Strict Loading Sequence) -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/luxury-core.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="citygo-light-theme">

  <!-- Atmospheric Background Glow Elements -->
  <div class="glow-orb glow-orb-top-left" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-bottom-right" aria-hidden="true"></div>

  <!-- Main System Application Wrapper -->
  <div id="app-root" class="app-layout-container">

    <!-- ==================================================================== -->
    <!-- LEFT NAVIGATION & DIRECTORY SIDEBAR SECTION                          -->
    <!-- ==================================================================== -->
    <aside id="sidebar-navigation" class="luxury-sidebar" aria-label="City Directory Sidebar">
      
      <!-- Brand & Header Banner -->
      <header class="sidebar-header">
        <div class="brand-badge" role="banner">
          <div class="logo-dot" aria-hidden="true"></div>
          <span class="brand-title">CityGO Luxury</span>
          <span class="version-tag">v2.4</span>
        </div>
        <h1 class="sidebar-title">Explore Global Venues</h1>
        <p class="sidebar-subtitle">Curated aesthetic shops, boutiques, and high-end dining experiences.</p>

        <!-- Bubbly Search Bar -->
        <div class="luxury-search-wrapper" role="search">
          <button class="search-icon-btn" id="search-trigger-btn" aria-label="Execute Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <input 
            type="text" 
            id="search-input" 
            class="luxury-search-input" 
            placeholder="Search bakeries, cafes, luxury spas..." 
            autocomplete="off"
            aria-label="Search venues by name or category"
          />
          <button class="search-clear-btn hidden" id="search-clear-btn" aria-label="Clear Search Input">✕</button>
        </div>
      </header>

      <!-- Category Filter Buttons Horizontal Scroll Bar -->
      <nav id="filter-carousel" class="filter-carousel" aria-label="Category Filters">
        <button class="bubbly-tag active" data-category="all">✨ All Places</button>
        <button class="bubbly-tag" data-category="bakery">🥐 Bakeries</button>
        <button class="bubbly-tag" data-category="restaurant">🍷 Fine Dining</button>
        <button class="bubbly-tag" data-category="cafe">☕ Specialty Cafes</button>
        <button class="bubbly-tag" data-category="spa">🌸 Spas & Wellness</button>
      </nav>

      <!-- Directory Stats Header -->
      <div class="directory-stats-bar">
        <span id="results-count" class="stats-text">Showing <strong>4</strong> venues</span>
        <div class="sort-dropdown-wrapper">
          <label for="sort-select" class="visually-hidden">Sort venues by</label>
          <select id="sort-select" class="bubbly-select">
            <option value="rating">Top Rated ★</option>
            <option value="name">Name (A-Z)</option>
            <option value="reviews">Most Reviews</option>
          </select>
        </div>
      </div>

      <!-- Shop Cards Listing Container -->
      <section id="shop-cards-container" class="shop-cards-container" aria-live="polite">
        <!-- JS dynamically injects shop cards here -->
        <div class="bubbly-card-skeleton" aria-hidden="true">
          <div class="skeleton-img"></div>
          <div class="skeleton-text-group">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line medium"></div>
          </div>
        </div>
      </section>

      <!-- Sidebar Footer Status -->
      <footer class="sidebar-footer">
        <p>© 2026 CityGO Interactive • Powered by Leaflet GIS</p>
      </footer>

    </aside>

    <!-- ==================================================================== -->
    <!-- INTERACTIVE MAP VIEWPORT SECTION                                     -->
    <!-- ==================================================================== -->
    <main id="map-viewport" class="map-viewport-container" aria-label="Interactive Map Viewport">
      
      <!-- Floating Map Control Bar -->
      <div class="map-overlay-controls">
        <button id="recenter-map-btn" class="bubbly-map-btn" title="Recenter Map View">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
          </svg>
          Recenter
        </button>
        <button id="toggle-layer-btn" class="bubbly-map-btn" title="Toggle Map Style">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          Tiles
        </button>
      </div>

      <!-- Map Loading Spinner Overlay -->
      <div id="map-loader" class="map-loader-overlay">
        <div class="bubbly-spinner"></div>
        <span>Loading CityGO Map Engine...</span>
      </div>

    </main>

    <!-- ==================================================================== -->
    <!-- DYNAMIC SLIDE-OUT DETAIL PANEL MODAL                                 -->
    <!-- ==================================================================== -->
    <dialog id="luxury-detail-panel" class="luxury-detail-panel panel-hidden" aria-label="Venue Detailed View">
      <!-- Dynamic Venue Details rendered by js/ui.js -->
    </dialog>

  </div>

  <!-- Leaflet GIS JavaScript Engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- CityGO Modular JavaScript System Architecture (Strict Loading Order) -->
  <script src="js/shop.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
