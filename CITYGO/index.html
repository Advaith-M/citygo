<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityGo Vector GIS Explorer HUD</title>
  
  <!-- System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet Interactive Map Engine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- MapLibre Vector Tile Engine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" />

  <!-- Core Luxury HUD Stylesheet -->
  <link rel="stylesheet" href="css/luxury-core.css">

  <!-- Leaflet Interactive Map Engine JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- MapLibre GL Vector Engine & Leaflet Bridge JavaScript -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
</head>
<body>
  <div class="app-viewport-wrapper">
    
    <!-- ==================================================================== -->
    <!-- 1. TOP NAVIGATION HUD BAR                                           -->
    <!-- ==================================================================== -->
    <header class="app-topbar">
      <div class="topbar-left">
        <div class="brand-badge">
          <span class="brand-pulse-dot"></span>
          <span class="brand-name">CITYGO</span>
          <span class="brand-tag">GIS PRO</span>
        </div>
        
        <div class="luxury-dropdown">
          <select class="district-select" id="districtSelect">
            <option value="all">All Districts</option>
            <option value="downtown">Downtown Core</option>
            <option value="uptown">Uptown District</option>
            <option value="westside">Westside Metro</option>
          </select>
        </div>
      </div>

      <div class="topbar-center-info">
        <div class="luxury-pill">
          <span class="telemetry-label">GPS TELEMETRY:</span>
          <span class="telemetry-value" id="gpsTelemetry">37.7749° N, 122.4194° W</span>
        </div>
        
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>LIVE VECTOR ENGINE</span>
        </div>
      </div>

      <div class="topbar-right">
        <!-- TOP BAR ACTION BUTTONS GROUP -->
        <div class="topbar-action-group">
          <button class="luxury-icon-only-btn" id="topLayersBtn" title="Layer Controls" aria-label="Layer Controls">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          </button>
          <button class="luxury-icon-only-btn" id="topSettingsBtn" title="Settings" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ==================================================================== -->
    <!-- 2. MAIN APPLICATION LAYOUT                                           -->
    <!-- ==================================================================== -->
    <div class="app-main-layout">
      
      <!-- COMPACT HIGH-TECH SIDEBAR (SLIM 310px WIDTH) -->
      <aside class="compact-sidebar" id="appSidebar">
        
        <!-- SIDEBAR HEADER WITH TOP-LEFT COLLAPSE / CLOSE BUTTON -->
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <button class="sidebar-toggle-btn" id="sidebarToggle" title="Close / Toggle Sidebar" aria-label="Close / Toggle Sidebar">
              ◀
            </button>
            <h2 class="sidebar-title">CITYGO EXPLORER</h2>
          </div>

          <!-- UTILITY ACTION BUTTONS MATRIX (ABOVE SEARCH BAR) -->
          <div class="quick-utility-matrix">
            <button class="matrix-btn" id="btnTicket" title="Ticket">
              <span class="btn-icon">🎟️</span>
              <span class="btn-text">Ticket</span>
            </button>
            <button class="matrix-btn" id="btnDirections" title="Directions">
              <span class="btn-icon">🗺️</span>
              <span class="btn-text">Directions</span>
            </button>
            <button class="matrix-btn" id="btnCall" title="Call">
              <span class="btn-icon">📞</span>
              <span class="btn-text">Call</span>
            </button>
            <button class="matrix-btn" id="btnAccount" title="Account">
              <span class="btn-icon">👤</span>
              <span class="btn-text">Account</span>
            </button>
            <button class="matrix-btn" id="btnSettings" title="Settings">
              <span class="btn-icon">⚙️</span>
              <span class="btn-text">Settings</span>
            </button>
            <button class="matrix-btn" id="btnCab" title="Cab">
              <span class="btn-icon">🚕</span>
              <span class="btn-text">Cab</span>
            </button>
          </div>

          <!-- INTERACTIVE SEARCH BAR -->
          <div class="luxury-search search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search live spots, venues..." autocomplete="off" />
            <button id="searchClearBtn" class="search-clear-btn" style="display: none;" aria-label="Clear Search">✕</button>
          </div>
        </div>

        <!-- CATEGORIES COMPARTMENT (HIDDEN WHEN SEARCHING) -->
        <div id="defaultCompartment" class="default-compartment">
          <div class="category-section-header">
            <span class="section-label">CATEGORIES</span>
          </div>

          <!-- CATEGORY BUTTONS WITH LOGOS -->
          <div class="categories-grid" id="categoryGrid">
            <button class="category-card-btn active" data-category="Food & Drinks">
              <span class="cat-logo">🍔</span>
              <span class="cat-name">Food & Drinks</span>
            </button>
            <button class="category-card-btn" data-category="Hotels">
              <span class="cat-logo">🏨</span>
              <span class="cat-name">Hotels</span>
            </button>
            <button class="category-card-btn" data-category="CitySpots">
              <span class="cat-logo">🏙️</span>
              <span class="cat-name">CitySpots</span>
            </button>
            <button class="category-card-btn" data-category="Shops">
              <span class="cat-logo">🛍️</span>
              <span class="cat-name">Shops</span>
            </button>
            <button class="category-card-btn" data-category="Facility">
              <span class="cat-logo">🏦</span>
              <span class="cat-name">Facility</span>
            </button>
            <button class="category-card-btn" data-category="Malls">
              <span class="cat-logo">🏢</span>
              <span class="cat-name">Malls</span>
            </button>
          </div>

          <!-- STATS HEADER -->
          <div class="stats-bar">
            <span id="feedTitle">TOP 7 RECOMMENDED (OPEN)</span>
            <span class="source-tag">LIVE VERIFIED</span>
          </div>
        </div>

        <!-- SEARCH OVERLAY STATUS HEADER -->
        <div id="searchCompartmentHeader" class="search-compartment-header" style="display: none;">
          <span id="searchResultLabel" class="search-status-label">PROMPT SEARCH RESULTS (TOP 7)</span>
          <button id="exitSearchBtn" class="exit-search-link">Reset View</button>
        </div>

        <!-- SCROLLABLE FEED FOR TOP 7 RECOMMENDED PLACES -->
        <div class="shop-cards-list" id="placesFeed">
          <!-- Places are dynamically populated by app.js -->
        </div>

        <!-- SIDEBAR FOOTER -->
        <div class="sidebar-footer">
          <span>SYSTEM: <strong class="pulse-text">ACTIVE HUD</strong></span>
          <span id="liveTimestamp">12:00:00 PM</span>
        </div>
      </aside>

      <!-- ==================================================================== -->
      <!-- 3. REAL-TIME INTERACTIVE MAP VIEWPORT AREA                           -->
      <!-- ==================================================================== -->
      <main class="map-viewport-container">
        <!-- Leaflet Map Container -->
        <div id="map" style="width: 100%; height: 100%; z-index: 1;"></div>
      </main>

    </div>
  </div>

  <!-- Application Logic Controller -->
  <script src="js/app.js"></script>
</body>
</html>
