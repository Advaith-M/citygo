<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityGO — Luxury City Directory & Interactive Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom Luxury Stylesheets -->
  <link rel="stylesheet" href="css/luxury-core.css" />
  <link rel="stylesheet" href="css/luxury-components.css" />
  <link rel="stylesheet" href="css/luxury-map.css" />
</head>
<body>

  <div id="app-root">
    
    <!-- Left Luxury Sidebar -->
    <aside class="luxury-sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">
          <div class="logo-dot"></div>
          <span>CityGO Luxury</span>
        </div>
        <h1 class="sidebar-title">Discover Curated Spots</h1>
        
        <!-- Bubbly Search Bar -->
        <div class="luxury-search-wrapper">
          <button class="search-icon-btn">🔍</button>
          <input type="text" id="search-input" class="luxury-search-input" placeholder="Search cafes, bakeries, fine dining..." />
        </div>
      </div>

      <!-- Bubbly Category Filter Carousel -->
      <div id="filter-carousel" class="filter-carousel">
        <!-- Dynamic Category Tags Injected via JS -->
      </div>

      <!-- Directory Cards Container -->
      <div id="shop-cards-container" class="shop-cards-container">
        <!-- Dynamic Cards Injected via JS -->
      </div>
    </aside>

    <!-- Interactive Map Viewport -->
    <main id="map-viewport">
      <!-- Leaflet map injects here -->
    </main>

    <!-- Slide-Out Luxury Detail Panel -->
    <div id="luxury-detail-panel" class="luxury-detail-panel panel-hidden">
      <!-- Dynamic Venue Details Injected via JS -->
    </div>

  </div>

  <!-- Leaflet JS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Application JS Code Architecture -->
  <script src="js/app-data.js"></script>
  <script src="js/app-core.js"></script>

</body>
</html>
